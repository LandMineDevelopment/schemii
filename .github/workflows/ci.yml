name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_TELEMETRY_SHA: ${{ github.sha }}
  CI_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_TELEMETRY_RUN_ID: ${{ github.run_id }}
  CI_TELEMETRY_RUN_ATTEMPT: ${{ github.run_attempt }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify complete change
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      profile: ${{ steps.classify.outputs.profile }}
      static: ${{ steps.classify.outputs.static }}
      node: ${{ steps.classify.outputs.node }}
      python: ${{ steps.classify.outputs.python }}
      postgres: ${{ steps.classify.outputs.postgres }}
      browser: ${{ steps.classify.outputs.browser }}
      browser_matrix: ${{ steps.classify.outputs.browser_matrix }}
      python_paths: ${{ steps.classify.outputs.python_paths }}
      acceptance: ${{ steps.reuse.outputs.acceptance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the complete base-to-head change
        id: classify
        run: python3 scripts/ci/classify_changes.py --output artifacts/ci-classification.json
      - name: Retain classification, including invalid comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-classification-attempt-${{ github.run_attempt }}
          path: artifacts/ci-classification.json
          if-no-files-found: error
          retention-days: 7
      - name: Admit recent identical-tree proven PR acceptance
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reuse_acceptance.py --classification artifacts/ci-classification.json --output artifacts/acceptance-reuse/reuse.json
      - name: Retain verified donor evidence with its original identities
        if: steps.reuse.outputs.acceptance == 'reused-full-pr' || steps.reuse.outputs.acceptance == 'reused-schemer-result-cache-pr' || steps.reuse.outputs.acceptance == 'reused-developer-inspection-pr'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reuse-attempt-${{ github.run_attempt }}
          path: artifacts/acceptance-reuse
          if-no-files-found: error
          retention-days: 7

  report-validation:
    name: Report Markdown and local links
    if: always()
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-classification-attempt-${{ github.run_attempt }}
          path: artifacts
      - name: Validate changed Markdown and local links
        run: python3 scripts/ci/validate_reports.py --classification artifacts/ci-classification.json --output artifacts/report-validation.json
      - name: Publish report validation timing and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validation-attempt-${{ github.run_attempt }}
          path: artifacts/report-validation.json
          if-no-files-found: error
          retention-days: 7

  static-quality:
    name: Incremental Python static quality
    if: always() && !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.static == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --constraint constraints.docker.txt --editable '.[quality]'
      - name: Check Python quality against the change base
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: python scripts/check_python_quality.py "$QUALITY_BASE"

  test:
    name: Node and deterministic Python behavior
    if: always() && !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.node == 'true' && needs.classify.outputs.acceptance != 'reused-full-pr' && needs.classify.outputs.acceptance != 'reused-schemer-result-cache-pr' && needs.classify.outputs.acceptance != 'reused-developer-inspection-pr'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fast frontend and harness feedback
        env:
          CI_TELEMETRY_FILE: artifacts/ci-timing/node.jsonl
        run: npm test
      - name: Validate public Node timing
        id: node-timing
        if: always()
        run: python3 scripts/ci/summary.py artifacts/ci-timing/node.jsonl artifacts/ci-timing/node-summary.json
      - name: Publish public Node timing
        if: always() && steps.node-timing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: node-timing-attempt-${{ github.run_attempt }}
          path: |
            artifacts/ci-timing/node.jsonl
            artifacts/ci-timing/node-summary.json
          retention-days: 7
      - uses: actions/setup-python@v5
        if: needs.classify.outputs.python == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: needs.classify.outputs.python == 'true'
        run: python -m pip install --upgrade pip
      - if: needs.classify.outputs.python == 'true'
        run: python -m pip install --constraint constraints.docker.txt --editable '.[dev]'
      - name: Deterministic Python behavior
        if: needs.classify.outputs.python == 'true'
        env:
          CI_TELEMETRY_FILE: artifacts/ci-timing/python.jsonl
          CI_TEST_PROFILE: ${{ needs.classify.outputs.profile }}
        run: python scripts/ci/python-tests.py ${{ needs.classify.outputs.python_paths }}
      - if: needs.classify.outputs.python == 'true'
        run: python -m compileall -q src tests testing
      - name: Validate public Python timing
        id: python-timing
        if: always() && needs.classify.outputs.python == 'true'
        run: python3 scripts/ci/summary.py artifacts/ci-timing/python.jsonl artifacts/ci-timing/python-summary.json
      - name: Publish public Python timing
        if: always() && needs.classify.outputs.python == 'true' && steps.python-timing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: python-timing-attempt-${{ github.run_attempt }}
          path: |
            artifacts/ci-timing/python.jsonl
            artifacts/ci-timing/python-summary.json
          retention-days: 7

  postgres-integration:
    name: Real PostgreSQL metadata behavior
    if: always() && !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.postgres == 'true' && needs.classify.outputs.acceptance != 'reused-full-pr' && needs.classify.outputs.acceptance != 'reused-schemer-result-cache-pr' && needs.classify.outputs.acceptance != 'reused-developer-inspection-pr'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: schemii_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schemii_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --constraint constraints.docker.txt --editable '.[dev]'
      - name: Exercise metadata migrations, credentials, isolation, and atomic imports
        env:
          SCHEMII_TEST_METADATA_DSN: host=127.0.0.1 port=5432 dbname=schemii_ci user=postgres
          SCHEMII_TEST_METADATA_PASSWORD: postgres-ci-password
          CI_TELEMETRY_FILE: artifacts/ci-timing/postgres.jsonl
          CI_TELEMETRY_LANE: postgres
        run: python -m pytest -q -p scripts.ci.pytest_timing tests/integration
      - name: Validate public PostgreSQL timing
        id: postgres-timing
        if: always()
        run: python3 scripts/ci/summary.py artifacts/ci-timing/postgres.jsonl artifacts/ci-timing/postgres-summary.json
      - name: Publish public PostgreSQL timing
        if: always() && steps.postgres-timing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-timing-attempt-${{ github.run_attempt }}
          path: |
            artifacts/ci-timing/postgres.jsonl
            artifacts/ci-timing/postgres-summary.json
          retention-days: 7

  browser-smoke:
    name: Assembled browser smoke (${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.total }})
    if: always() && !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.browser == 'true' && needs.classify.outputs.acceptance != 'reused-full-pr' && needs.classify.outputs.acceptance != 'reused-schemer-result-cache-pr' && needs.classify.outputs.acceptance != 'reused-developer-inspection-pr'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify browser discovery and shard coverage
        if: matrix.project == 'desktop-chromium' && matrix.shard == 1
        run: node --test tests/browser-infrastructure/shards.test.mjs
      - name: Check installed runtime and plan exact Ubuntu font payloads
        id: browser-dependencies
        run: node scripts/ci/browser-dependencies.mjs plan
      - name: Reuse authenticated immutable font archives
        id: browser-font-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.browser-dependencies.outputs.cache_dir }}
          key: ${{ steps.browser-dependencies.outputs.cache_key }}
      - name: Prepare complete fonts and validate Chromium runtime
        id: browser-runtime
        run: node scripts/ci/browser-dependencies.mjs prepare
      - name: Retain verified immutable font archives before application execution
        if: success() && steps.browser-runtime.outcome == 'success' && steps.browser-font-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.browser-dependencies.outputs.cache_dir }}
          key: ${{ steps.browser-font-cache.outputs.cache-primary-key }}
      - name: Start the canonical application stack
        run: ./start.sh
      - name: Exercise browser flows
        timeout-minutes: 28
        env:
          SCHEMII_E2E_BOOTSTRAP: "1"
          CI_TELEMETRY_FILE: artifacts/ci-timing/browser.jsonl
          CI_TELEMETRY_PROJECT: ${{ matrix.project }}
        run: node scripts/ci/run-browser-shard.mjs --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --profile=${{ needs.classify.outputs.profile }}
      - name: Verify metadata backup recovery in an isolated database
        if: matrix.project == 'desktop-chromium' && matrix.shard == 1 && needs.classify.outputs.profile != 'schemer-result-cache' && needs.classify.outputs.profile != 'developer-inspection'
        run: |
          ./start.sh --backup artifacts/recovery-smoke
          ./start.sh --verify-backup artifacts/recovery-smoke
      - name: Validate public browser timing
        id: browser-timing
        if: always()
        run: python3 scripts/ci/summary.py artifacts/ci-timing/browser.jsonl artifacts/ci-timing/browser-summary.json
      - name: Publish public browser timing, including failed first attempts
        if: always() && steps.browser-timing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: browser-timing-${{ matrix.project }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/ci-timing/browser.jsonl
            artifacts/ci-timing/browser-summary.json
            artifacts/ci-timing/browser-dependencies.json
          retention-days: 7

  timing-rollup:
    name: Public workflow timing
    if: always()
    needs: [classify, report-validation, static-quality, test, postgres-integration, browser-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download classification
        uses: actions/download-artifact@v4
        with:
          name: ci-classification-attempt-${{ github.run_attempt }}
          path: artifacts
      - name: Download only public timing evidence
        if: always() && needs.classify.outputs.lane != 'reports' && needs.classify.outputs.acceptance != 'reused-full-pr' && needs.classify.outputs.acceptance != 'reused-schemer-result-cache-pr' && needs.classify.outputs.acceptance != 'reused-developer-inspection-pr'
        uses: actions/download-artifact@v4
        with:
          pattern: '*-timing*-attempt-${{ github.run_attempt }}'
          path: artifacts/ci-timing/lanes
      - name: Download original donor acceptance evidence
        if: needs.classify.outputs.acceptance == 'reused-full-pr' || needs.classify.outputs.acceptance == 'reused-schemer-result-cache-pr' || needs.classify.outputs.acceptance == 'reused-developer-inspection-pr'
        uses: actions/download-artifact@v4
        with:
          name: acceptance-reuse-attempt-${{ github.run_attempt }}
          path: artifacts/acceptance-reuse
      - name: Collect workflow dispatch, queue, setup and execution timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: always()
        run: |
          reuse_args=()
          if [[ "${{ needs.classify.outputs.acceptance }}" == 'reused-full-pr' || "${{ needs.classify.outputs.acceptance }}" == 'reused-schemer-result-cache-pr' || "${{ needs.classify.outputs.acceptance }}" == 'reused-developer-inspection-pr' ]]; then
            reuse_args=(--reuse artifacts/acceptance-reuse/reuse.json)
          fi
          python3 scripts/ci/workflow_timing.py --classification artifacts/ci-classification.json --inputs artifacts/ci-timing/lanes --output artifacts/ci-timing/workflow-summary.json "${reuse_args[@]}"
      - name: Publish public workflow timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-timing-attempt-${{ github.run_attempt }}
          path: artifacts/ci-timing/workflow-summary.json
          retention-days: 7

  required-gate:
    name: CI validation
    if: always()
    needs: [classify, report-validation, static-quality, test, postgres-integration, browser-smoke, timing-rollup]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ci-classification-attempt-${{ github.run_attempt }}
          path: artifacts
      - name: Download complete timing receipt
        uses: actions/download-artifact@v4
        with:
          name: workflow-timing-attempt-${{ github.run_attempt }}
          path: artifacts/ci-timing
      - name: Download donor proof for independent provider revalidation
        if: needs.classify.outputs.acceptance == 'reused-full-pr' || needs.classify.outputs.acceptance == 'reused-schemer-result-cache-pr' || needs.classify.outputs.acceptance == 'reused-developer-inspection-pr'
        uses: actions/download-artifact@v4
        with:
          name: acceptance-reuse-attempt-${{ github.run_attempt }}
          path: artifacts/acceptance-reuse
      - name: Resolve report validation or every required source layer
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          reuse_args=()
          if [[ "${{ needs.classify.outputs.acceptance }}" == 'reused-full-pr' || "${{ needs.classify.outputs.acceptance }}" == 'reused-schemer-result-cache-pr' || "${{ needs.classify.outputs.acceptance }}" == 'reused-developer-inspection-pr' ]]; then
            reuse_args=(--reuse artifacts/acceptance-reuse/reuse.json)
          fi
          python3 scripts/ci/required_gate.py --classification artifacts/ci-classification.json --timing artifacts/ci-timing/workflow-summary.json "${reuse_args[@]}"
