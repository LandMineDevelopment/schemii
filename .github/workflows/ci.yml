name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and browser behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --constraint constraints.docker.txt --editable '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  postgres-integration:
    name: Real PostgreSQL metadata behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: schemii_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schemii_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --constraint constraints.docker.txt --editable '.[dev]'
      - name: Exercise metadata migrations, credentials, isolation, and atomic imports
        env:
          SCHEMII_TEST_METADATA_DSN: host=127.0.0.1 port=5432 dbname=schemii_ci user=postgres
          SCHEMII_TEST_METADATA_PASSWORD: postgres-ci-password
        run: python -m pytest -q tests/integration

  browser-smoke:
    name: Assembled browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the canonical application stack
        run: ./start.sh
      - name: Exercise desktop and Android-sized browser flows
        run: npm run test:e2e
