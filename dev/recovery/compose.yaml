# Separate ephemeral project; no production volumes, credentials, or network.
services:
  database:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: verifier
      POSTGRES_DB: schemii_verify
      POSTGRES_HOST_AUTH_METHOD: trust
    command: [postgres, -c, log_min_messages=panic, -c, log_min_error_statement=panic]
    tmpfs:
      - /var/lib/postgresql/data:size=${SCHEMII_VERIFY_DATA_SIZE:-2g},mode=0700
    mem_limit: ${SCHEMII_VERIFY_MEMORY:-2g}
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U verifier -d schemii_verify"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [verification]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
  verifier:
    image: schemii-test-application
    user: "${SCHEMII_RECOVERY_UID}:${SCHEMII_RECOVERY_GID}"
    command: [python, /recovery/verify.py]
    volumes:
      - "${SCHEMII_RECOVERY_BUNDLE}:/backup:ro"
      - ./dev/recovery:/recovery:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    networks: [verification]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
networks:
  verification:
    internal: true
