[postgres.connections]
maximum_total = 20
maximum_per_identity = 4
acquire_timeout_seconds = 5.0

[postgres.catalog]
maximum_namespaces = 10000
maximum_tables = 2000
maximum_columns = 30000
maximum_constraints = 20000
maximum_indexes = 10000
maximum_triggers = 10000
maximum_functions = 5000
maximum_views = 5000
maximum_types = 5000
maximum_total_objects = 60000
maximum_definition_bytes = 262144
maximum_total_text_bytes = 16777216

[postgres.timeouts]
catalog_statement_seconds = 900
migration_statement_seconds = 120
lock_wait_seconds = 30

[console]
maximum_statements_per_run = 20
transaction_idle_seconds = 1800
transaction_maximum_seconds = 1800
maximum_saved_queries_per_workspace = 100

[console.results]
page_rows = 100
page_memory_bytes = 4194304
maximum_cell_bytes = 262144
maximum_live_read_sessions = 12
result_ttl_seconds = 900

[console.history]
limit = 100

[migrations]
review_ttl_seconds = 900
execution_lease_seconds = 120
worker_poll_seconds = 1.0

[resources]
maximum_connections_per_user = 100
maximum_workspaces_per_user = 1000
maximum_models_per_user = 100
# Per semantic definition, layout, or Explore input document; never query rows.
maximum_model_document_bytes = 1048576
design_history_actions_per_workspace = 100

[schemoo]
# Bounded schema-only cache for editing. Every preview revalidates live PostgreSQL.
maximum_cached_catalogs = 8
catalog_refresh_seconds = 30

[metadata.limit_events]
retention_days = 30
maximum_events = 100000

[ai]
enabled = true
maximum_concurrent_turns = 4
maximum_concurrent_turns_per_user = 2
maximum_chats_per_workspace = 50
chat_retention_days = 90
# Set false to retain Pi credentials until manual disconnect.
# This does not manage the existing OpenCode credential store.
credential_expiration_enabled = true
# Days without Schemii activity before deletion; ignored when expiration is disabled.
credential_inactivity_days = 30
message_history_limit = 200
activity_history_limit = 1000
maximum_proposals_per_turn = 10
# Bound autonomous work without storing any query rows in metadata.
maximum_read_queries_per_batch = 8
# Tool-enabled model rounds; one tools-disabled summary follows at the limit.
# The summary still respects workflow timeout and context/memory limits.
maximum_tool_rounds = 8
tool_timeout_seconds = 300
prompt_bytes = 65536
# Public answer text and tool-call arguments per provider response; private
# reasoning/signatures use context_bytes instead and never enter chat metadata.
response_bytes = 262144
proposal_bytes = 524288
proposal_bytes_per_turn = 1048576
# Bounds inference input and each transient native provider continuation message.
context_bytes = 524288
result_context_rows = 100
result_context_bytes = 262144
transient_response_memory_bytes = 16777216
transient_response_ttl_seconds = 900
proposal_ttl_seconds = 900
provider_timeout_seconds = 300
runtime_status_cache_seconds = 30
# Refresh public free-model availability/prices; hide entries older than max stale.
catalog_refresh_seconds = 3600
catalog_max_stale_seconds = 86400
