pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    log_format schemii escape=json
        '{"event":"ingress_request","request_id":"$request_id",'
        '"application_request_id":"$upstream_http_x_request_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout schemii;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Accommodate the API's 16 MiB SQL/design import contract plus JSON overhead.
    client_max_body_size 20m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream schemii_backend {
        zone schemii_backend 64k;
        server schemii:8000 resolve;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/localhost.crt;
        ssl_certificate_key /etc/nginx/tls/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://schemii_backend;
            proxy_http_version 1.1;
            # Stream COPY transfers and large API maps end to end. Spooling a
            # response larger than the 16 MiB /tmp mount truncates it for slow
            # clients; request spooling also delays upload execution and Stop.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host localhost;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;

            # COPY file bytes stream directly to the owned PostgreSQL session.
            # Keep ordinary API request limits while allowing large imports.
            location ~ "^/api/v1/schemii/workspaces/[^/]+/console/sessions/[^/]+/copy/uploads/[^/]+$" {
                client_max_body_size 0;
                # A nested regex location needs its own proxy content handler;
                # the parent's headers, timeouts, and streaming settings inherit.
                proxy_pass http://schemii_backend;
            }
        }
    }
}
