name: schemii-test

services:
  schemii:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      postgres-seed:
        condition: service_completed_successfully
    init: true
    networks:
      - database
      - app-ingress
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ingress:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    depends_on:
      schemii:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${SCHEMII_TEST_APP_PORT:-8001}:8080"
    volumes:
      - ./dev/ingress/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-ingress
      - loopback
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Host: localhost", "http://127.0.0.1:8080/api/v1/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${SCHEMII_TEST_POSTGRES_DB:-schemii_test}
      POSTGRES_USER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      POSTGRES_PASSWORD: ${SCHEMII_TEST_POSTGRES_PASSWORD:-schemii-local-test}
    volumes:
      - schemii-test-postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres-seed:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${SCHEMII_TEST_POSTGRES_DB:-schemii_test}
      PGUSER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      SCHEMII_TEST_POSTGRES_PASSWORD: ${SCHEMII_TEST_POSTGRES_PASSWORD:-schemii-local-test}
    command: ["/bin/sh", "/seed/seed.sh"]
    user: postgres
    volumes:
      - ./dev/postgres/seed.sh:/seed/seed.sh:ro
      - ./dev/postgres/seed.sql:/seed/seed.sql:ro
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  schemii-test-postgres:

networks:
  database:
    internal: true
  app-ingress:
    internal: true
  loopback:
