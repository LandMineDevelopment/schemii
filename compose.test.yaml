name: schemii-test

services:
  ai-prototype:
    profiles: [ai-prototype]
    image: schemii-test-ai-prototype
    build:
      context: .
      dockerfile: ai/prototype/Dockerfile
    network_mode: none
    user: node
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: "no"

  ai-prototype-runtime:
    image: schemii-test-ai-prototype
    build:
      context: .
      dockerfile: ai/prototype/Dockerfile
    command: ["node", "server.js"]
    environment:
      SCHEMII_PI_PASSWORD_FILE: /run/secrets/opencode_password
    volumes:
      - "${SCHEMII_OPENCODE_PASSWORD_SECRET_FILE:-./.schemii/secrets/opencode_password}:/run/secrets/opencode_password:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-10001}"
    networks:
      - ai-runtime
    user: node
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "import {readFileSync} from 'node:fs'; const secret=readFileSync('/run/secrets/opencode_password','utf8').trim(); try { const r=await fetch('http://127.0.0.1:4097/health',{headers:{Authorization:'Bearer '+secret},signal:AbortSignal.timeout(2000)}); process.exit(r.ok?0:1); } catch { process.exit(1); }"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  schemii:
    image: schemii-test-application
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SCHEMII_DEPLOYMENT_MODE: local-development
      SCHEMII_DEVELOPER_INSPECTION: "1"
      SCHEMII_TARGET_EGRESS_MODE: internal-only
      SCHEMII_ALLOWED_TARGET_HOSTS: demo-postgres,postgres
      SCHEMII_STORAGE_MODE: postgresql
      SCHEMII_METADATA_DSN: "host=metadata-postgres port=5432 dbname=${SCHEMII_TEST_POSTGRES_DB:-schemii_test} user=${SCHEMII_METADATA_APP_USER:-schemii_metadata_app}"
      SCHEMII_METADATA_PASSWORD_FILE: /run/secrets/metadata_app_password
      SCHEMII_METADATA_ENCRYPTION_KEY_FILE: /run/secrets/metadata_encryption_key
      SCHEMII_METADATA_TARGET_HOST_ALIASES: metadata-postgres
      SCHEMII_CONFIG_FILE: /etc/schemii/schemii.toml
      SCHEMII_PI_PROTOTYPE_URL: http://ai-prototype-runtime:4097
      SCHEMER_PREVIEW_ROWS: ${SCHEMER_PREVIEW_ROWS:-10000}
      SCHEMER_PREVIEW_BYTES: ${SCHEMER_PREVIEW_BYTES:-8388608}
      SCHEMER_DASHBOARD_PREVIEW_ROWS: ${SCHEMER_DASHBOARD_PREVIEW_ROWS:-50000}
      SCHEMER_DASHBOARD_PREVIEW_BYTES: ${SCHEMER_DASHBOARD_PREVIEW_BYTES:-33554432}
      SCHEMER_STREAM_SECONDS: ${SCHEMER_STREAM_SECONDS:-120}
      SCHEMER_EXPORT_SECONDS: ${SCHEMER_EXPORT_SECONDS:-900}
    depends_on:
      metadata-bootstrap:
        condition: service_completed_successfully
      postgres-seed:
        condition: service_completed_successfully
      ai-prototype-runtime:
        condition: service_healthy
    init: true
    networks:
      - database
      - app-ingress
      - ai-runtime
    volumes:
      - "${SCHEMII_METADATA_APP_PASSWORD_SECRET_FILE:-./.schemii/secrets/metadata_app_password}:/run/secrets/metadata_app_password:ro"
      - "${SCHEMII_METADATA_ENCRYPTION_KEY_SECRET_FILE:-./.schemii/secrets/metadata_encryption_key}:/run/secrets/metadata_encryption_key:ro"
      - ./dev/schemii.toml:/etc/schemii/schemii.toml:ro
      - "${SCHEMII_OPENCODE_PASSWORD_SECRET_FILE:-./.schemii/secrets/opencode_password}:/run/secrets/opencode_password:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped


  ingress:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    depends_on:
      schemii:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${SCHEMII_TEST_APP_PORT:-8001}:8443"
    volumes:
      - ./dev/ingress/nginx.conf:/etc/nginx/nginx.conf:ro
      - "${SCHEMII_TEST_TLS_CERTIFICATE:-./.schemii/tls/localhost.crt}:/etc/nginx/tls/localhost.crt:ro"
      - "${SCHEMII_TEST_TLS_PRIVATE_KEY:-./.schemii/tls/localhost.key}:/etc/nginx/tls/localhost.key:ro"
    networks:
      - app-ingress
      - loopback
    user: "101:101"
    group_add:
      - "${SCHEMII_TLS_READER_GID:-101}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "--header", "Host: localhost", "https://127.0.0.1:8443/api/v1/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  metadata-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${SCHEMII_TEST_POSTGRES_DB:-schemii_test}
      POSTGRES_USER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      POSTGRES_PASSWORD_FILE: /run/secrets/metadata_bootstrap_password
    volumes:
      - schemii-test-postgres:/var/lib/postgresql/data
      - "${SCHEMII_METADATA_BOOTSTRAP_PASSWORD_SECRET_FILE:-./.schemii/secrets/metadata_password}:/run/secrets/metadata_bootstrap_password:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-999}"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  metadata-bootstrap:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    depends_on:
      metadata-postgres:
        condition: service_healthy
    environment:
      PGHOST: metadata-postgres
      PGPORT: 5432
      PGDATABASE: ${SCHEMII_TEST_POSTGRES_DB:-schemii_test}
      PGUSER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      SCHEMII_METADATA_APP_USER: ${SCHEMII_METADATA_APP_USER:-schemii_metadata_app}
      SCHEMII_METADATA_BOOTSTRAP_PASSWORD_FILE: /run/secrets/metadata_bootstrap_password
      SCHEMII_METADATA_APP_PASSWORD_FILE: /run/secrets/metadata_app_password
    command: ["/bin/sh", "/bootstrap/metadata-bootstrap.sh"]
    user: postgres
    volumes:
      - ./dev/postgres/metadata-bootstrap.sh:/bootstrap/metadata-bootstrap.sh:ro
      - "${SCHEMII_METADATA_BOOTSTRAP_PASSWORD_SECRET_FILE:-./.schemii/secrets/metadata_password}:/run/secrets/metadata_bootstrap_password:ro"
      - "${SCHEMII_METADATA_APP_PASSWORD_SECRET_FILE:-./.schemii/secrets/metadata_app_password}:/run/secrets/metadata_app_password:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-999}"
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  demo-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: schemii_demo_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/demo_admin_password
    volumes:
      - schemii-test-demo-postgres:/var/lib/postgresql/data
      - "${SCHEMII_DEMO_ADMIN_PASSWORD_SECRET_FILE:-./.schemii/secrets/demo_admin_password}:/run/secrets/demo_admin_password:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-999}"
    networks:
      database:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemii_demo_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  demo-bootstrap:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    depends_on:
      demo-postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      SCHEMII_DEMO_ADMIN_USER: schemii_demo_admin
      SCHEMII_DEMO_TARGET_DATABASE: ${SCHEMII_TEST_POSTGRES_DB:-schemii_test}
      SCHEMII_DEMO_TARGET_USER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      SCHEMII_DEMO_ADMIN_PASSWORD_FILE: /run/secrets/demo_admin_password
      SCHEMII_DEMO_TARGET_PASSWORD_FILE: /run/secrets/demo_target_password
    command: ["/bin/sh", "/bootstrap/demo-bootstrap.sh"]
    user: postgres
    volumes:
      - ./dev/postgres/demo-bootstrap.sh:/bootstrap/demo-bootstrap.sh:ro
      - "${SCHEMII_DEMO_ADMIN_PASSWORD_SECRET_FILE:-./.schemii/secrets/demo_admin_password}:/run/secrets/demo_admin_password:ro"
      - "${SCHEMII_DEMO_TARGET_PASSWORD_SECRET_FILE:-./.schemii/secrets/demo_target_password}:/run/secrets/demo_target_password:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-999}"
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  postgres-seed:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    depends_on:
      demo-bootstrap:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${SCHEMII_TEST_POSTGRES_DB:-schemii_test}
      PGUSER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      SCHEMII_DEMO_ADMIN_USER: schemii_demo_admin
      SCHEMII_TEST_POSTGRES_PASSWORD_FILE: /run/secrets/demo_target_password
      SCHEMII_DEMO_ADMIN_PASSWORD_FILE: /run/secrets/demo_admin_password
      SCHEMII_RESET_MIGRATION_DEMO: ${SCHEMII_RESET_MIGRATION_DEMO:-0}
    command: ["/bin/sh", "/seed/seed.sh"]
    user: postgres
    volumes:
      - ./dev/postgres/seed.sh:/seed/seed.sh:ro
      - ./dev/postgres/seed.sql:/seed/seed.sql:ro
      - ./dev/postgres/migration-demo.sql:/seed/migration-demo.sql:ro
      - "${SCHEMII_DEMO_TARGET_PASSWORD_SECRET_FILE:-./.schemii/secrets/demo_target_password}:/run/secrets/demo_target_password:ro"
      - "${SCHEMII_DEMO_ADMIN_PASSWORD_SECRET_FILE:-./.schemii/secrets/demo_admin_password}:/run/secrets/demo_admin_password:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-999}"
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  demo-fixture:
    profiles: ["demo-fixture"]
    image: schemii-test-application
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SCHEMII_DEPLOYMENT_MODE: local-development
      SCHEMII_TARGET_EGRESS_MODE: internal-only
      SCHEMII_ALLOWED_TARGET_HOSTS: demo-postgres,postgres
      SCHEMII_STORAGE_MODE: postgresql
      SCHEMII_METADATA_DSN: "host=metadata-postgres port=5432 dbname=${SCHEMII_TEST_POSTGRES_DB:-schemii_test} user=${SCHEMII_METADATA_APP_USER:-schemii_metadata_app}"
      SCHEMII_METADATA_PASSWORD_FILE: /run/secrets/metadata_app_password
      SCHEMII_METADATA_ENCRYPTION_KEY_FILE: /run/secrets/metadata_encryption_key
      SCHEMII_METADATA_TARGET_HOST_ALIASES: metadata-postgres
      SCHEMII_DEMO_SCENARIO: ${SCHEMII_DEMO_SCENARIO:-baseline}
      SCHEMII_DEMO_SOURCE_REVISION: ${SCHEMII_DEMO_SOURCE_REVISION:-unknown+dirty}
      SCHEMII_DEMO_POSTGRES_HOST: postgres
      SCHEMII_DEMO_POSTGRES_PORT: 5432
      SCHEMII_DEMO_POSTGRES_DATABASE: schemii_migration_demo
      SCHEMII_DEMO_POSTGRES_USER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      SCHEMII_DEMO_POSTGRES_PASSWORD_FILE: /run/secrets/demo_target_password
      SCHEMII_DEMO_FIXTURE_ROOT: /fixture
    command:
      - /bin/sh
      - -c
      - |
        printf 'Starting Schemii demo metadata fixture...\n'
        python /fixture/demo-fixture.py
    volumes:
      - ./dev/postgres:/fixture:ro
      - "${SCHEMII_METADATA_APP_PASSWORD_SECRET_FILE:-./.schemii/secrets/metadata_app_password}:/run/secrets/metadata_app_password:ro"
      - "${SCHEMII_METADATA_ENCRYPTION_KEY_SECRET_FILE:-./.schemii/secrets/metadata_encryption_key}:/run/secrets/metadata_encryption_key:ro"
      - "${SCHEMII_DEMO_TARGET_PASSWORD_SECRET_FILE:-./.schemii/secrets/demo_target_password}:/run/secrets/demo_target_password:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-10001}"
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  schemii-test-postgres:
  schemii-test-demo-postgres:

networks:
  database:
    internal: true
  app-ingress:
    internal: true
  loopback:
  ai-runtime:
