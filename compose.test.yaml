name: schemii-test

services:
  schemii:
    image: schemii-test-application
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SCHEMII_DEVELOPER_INSPECTION: "1"
      SCHEMII_METADATA_DSN: "host=postgres port=5432 dbname=${SCHEMII_TEST_POSTGRES_DB:-schemii_test} user=${SCHEMII_TEST_POSTGRES_USER:-schemii}"
      SCHEMII_METADATA_PASSWORD_FILE: /run/secrets/metadata_password
      SCHEMII_METADATA_ENCRYPTION_KEY_FILE: /run/secrets/metadata_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
      postgres-seed:
        condition: service_completed_successfully
    init: true
    networks:
      - database
      - app-ingress
    volumes:
      - "${SCHEMII_METADATA_PASSWORD_SECRET_FILE:-./.schemii/secrets/metadata_password}:/run/secrets/metadata_password:ro"
      - "${SCHEMII_METADATA_ENCRYPTION_KEY_SECRET_FILE:-./.schemii/secrets/metadata_encryption_key}:/run/secrets/metadata_encryption_key:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ingress:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    depends_on:
      schemii:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${SCHEMII_TEST_APP_PORT:-8001}:8443"
    volumes:
      - ./dev/ingress/nginx.conf:/etc/nginx/nginx.conf:ro
      - "${SCHEMII_TEST_TLS_CERTIFICATE:-./.schemii/tls/localhost.crt}:/etc/nginx/tls/localhost.crt:ro"
      - "${SCHEMII_TEST_TLS_PRIVATE_KEY:-./.schemii/tls/localhost.key}:/etc/nginx/tls/localhost.key:ro"
    networks:
      - app-ingress
      - loopback
    user: "101:101"
    group_add:
      - "${SCHEMII_TLS_READER_GID:-101}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "--header", "Host: localhost", "https://127.0.0.1:8443/api/v1/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${SCHEMII_TEST_POSTGRES_DB:-schemii_test}
      POSTGRES_USER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      POSTGRES_PASSWORD: ${SCHEMII_TEST_POSTGRES_PASSWORD:-schemii-local-test}
    volumes:
      - schemii-test-postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres-seed:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${SCHEMII_TEST_POSTGRES_DB:-schemii_test}
      PGUSER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      SCHEMII_TEST_POSTGRES_PASSWORD: ${SCHEMII_TEST_POSTGRES_PASSWORD:-schemii-local-test}
      SCHEMII_RESET_MIGRATION_DEMO: ${SCHEMII_RESET_MIGRATION_DEMO:-0}
    command: ["/bin/sh", "/seed/seed.sh"]
    user: postgres
    volumes:
      - ./dev/postgres/seed.sh:/seed/seed.sh:ro
      - ./dev/postgres/seed.sql:/seed/seed.sql:ro
      - ./dev/postgres/migration-demo.sql:/seed/migration-demo.sql:ro
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  demo-fixture:
    profiles: ["demo-fixture"]
    image: schemii-test-application
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SCHEMII_METADATA_DSN: "host=postgres port=5432 dbname=${SCHEMII_TEST_POSTGRES_DB:-schemii_test} user=${SCHEMII_TEST_POSTGRES_USER:-schemii}"
      SCHEMII_METADATA_PASSWORD_FILE: /run/secrets/metadata_password
      SCHEMII_METADATA_ENCRYPTION_KEY_FILE: /run/secrets/metadata_encryption_key
      SCHEMII_DEMO_SCENARIO: ${SCHEMII_DEMO_SCENARIO:-baseline}
      SCHEMII_DEMO_SOURCE_REVISION: ${SCHEMII_DEMO_SOURCE_REVISION:-unknown+dirty}
      SCHEMII_DEMO_POSTGRES_HOST: postgres
      SCHEMII_DEMO_POSTGRES_PORT: 5432
      SCHEMII_DEMO_POSTGRES_DATABASE: schemii_migration_demo
      SCHEMII_DEMO_POSTGRES_USER: ${SCHEMII_TEST_POSTGRES_USER:-schemii}
      SCHEMII_DEMO_POSTGRES_PASSWORD_FILE: /run/secrets/metadata_password
      SCHEMII_DEMO_FIXTURE_ROOT: /fixture
    command:
      - /bin/sh
      - -c
      - |
        printf 'Starting Schemii demo metadata fixture...\n'
        python /fixture/demo-fixture.py
    volumes:
      - ./dev/postgres:/fixture:ro
      - "${SCHEMII_METADATA_PASSWORD_SECRET_FILE:-./.schemii/secrets/metadata_password}:/run/secrets/metadata_password:ro"
      - "${SCHEMII_METADATA_ENCRYPTION_KEY_SECRET_FILE:-./.schemii/secrets/metadata_encryption_key}:/run/secrets/metadata_encryption_key:ro"
    group_add:
      - "${SCHEMII_SECRET_READER_GID:-10001}"
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  schemii-test-postgres:

networks:
  database:
    internal: true
  app-ingress:
    internal: true
  loopback:
