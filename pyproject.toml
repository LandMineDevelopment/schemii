[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "schemii"
version = "0.1.0"
description = "Unified Schemii backend for Schemii, Schemoo, and Schemer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=46,<51",
    "fastapi>=0.141,<1",
    "pglast>=7.18,<8",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.11,<3",
    "sqlglot>=28.10.1,<29",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8.4,<9",
]
quality = [
    "mypy==2.3.1",
    "ruff==0.16.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"schemii.schemii" = ["web/*.html", "web/assets/*"]
"schemii.schemoo" = ["web/*"]
"schemii.schemer" = ["web/*"]
"schemii.common" = ["web/assets/*"]
"schemii.common.metadata" = ["migrations/*.sql"]
"schemii.schemii.metadata" = ["migrations/*.sql"]
"schemii.schemoo.metadata" = ["migrations/*.sql"]
"schemii.schemer.metadata" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "testing"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
warn_unused_ignores = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["schemii.schemoo.join_types", "schemii.schemer.time_analysis"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
