[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "schemii"
version = "0.1.0"
description = "Unified Schemii backend for Schemii, Schemoo, and Schemer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=46,<51",
    "fastapi>=0.141,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8.4,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"schemii.schemii" = ["web/*.html", "web/assets/*"]
"schemii.common" = ["web/assets/*"]
"schemii.common.metadata" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
