[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemii"
version = "0.1.0"
description = "A standalone PostgreSQL schema designer, introspection tool, and migration workbench"
readme = "README.md"
license = "MIT"
authors = [{ name = "LandMineDevelopment" }]
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1,<4", "sqlglot>=28.10,<29"]

[project.urls]
Homepage = "https://github.com/LandMineDevelopment/schemii"
Repository = "https://github.com/LandMineDevelopment/schemii"
Issues = "https://github.com/LandMineDevelopment/schemii/issues"

[project.scripts]
schemii = "schemii.server:main"
schemer = "schemii.schemer_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
schemii = ["web/*", "schemer_web/*", "shared_web/*", "metadata/migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
