# Linux-only bridge for PostgreSQL bound to host loopback.
services:
  schemii:
    volumes:
      - host-postgres-socket:/run/schemii-host-postgres:ro

  host-postgres-exporter:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "rm -f /run/schemii-host-postgres/.s.PGSQL.5432 && exec nginx -g 'daemon off;' -c /etc/nginx/nginx.conf"
    volumes:
      - host-postgres-socket:/run/schemii-host-postgres
      - ./docker/ingress/host-postgres-exporter.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  local-postgres-relay:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    network_mode: service:schemii
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    depends_on:
      host-postgres-exporter:
        condition: service_started
      schemii:
        condition: service_started
    volumes:
      - host-postgres-socket:/run/schemii-host-postgres:ro
      - ./docker/ingress/local-postgres-relay.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  host-postgres-socket:
